{% set name = "pandas-flavor" %}
{% set version = "0.8.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.replace('-', '_')}}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 255fa5851833ee0132c4fdd6c1565ec1e938a8c2671c37e408006da6b2bdc366

build:
  number: 0
  skip: true  # [py<310]

outputs:
  - name: pandas-flavor
    build:
      script: python -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - pip
        - python 
        - wheel
        - setuptools >=61.0
        - setuptools-scm >=8
      run:
        - python
        - pandas >=0.23
        - xarray
    test:
      source_files:
        - tests
      imports:
        - pandas_flavor
      commands:
        - pip check
        - pytest -v tests
      requires:
        - pip
        - pytest

  - name: pandas_flavor
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('pandas-flavor', max_pin="x.x.x") }}
    test:
      imports:
        - pandas_flavor

about:
  home: https://github.com/Zsailer/pandas_flavor
  summary: The easy way to write your own Pandas flavor.
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: The easy way to write your own Pandas flavor.
  doc_url: https://github.com/Zsailer/pandas_flavor
  dev_url: https://github.com/Zsailer/pandas_flavor

extra:
  recipe-maintainers:
    - ocefpaf
    - zsailer
